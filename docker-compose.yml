services:
  postgres:
    image: "postgres:latest"
    restart: "unless-stopped"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - 5432:5432
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: "on-failure"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-dir"
      - "/migrations"
      - "postgres"
      - "postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
      - "up"

volumes:
  pgdata:
