# OpenAPI spec for the core OIDC API of centrauth.
#
# Scope: protocol endpoints used by OIDC/OAuth clients (health, discovery,
# JWKS, authorization, and token exchange).
#
# The admin UI routes (/admin, /setup, operator login/logout) are
# intentionally excluded. They are server-rendered HTML and not an API.
openapi: 3.0.3
info:
  title: centrauth OIDC API
  description: |
    centrauth is a self-hosted OpenID Connect provider.

    This document covers the protocol endpoints a relying party uses:

    - `GET /.well-known/openid-configuration` — OIDC discovery metadata
    - `GET /.well-known/jwks.json` — public signing keys
    - `GET /authorize` — start the authorization code flow (PKCE required)
    - `POST /token` — exchange an authorization code for an ID token
    - `GET /healthz` — service health probe

    ### Conventions
    - The authorization code flow is the only supported flow
      (`response_type=code`).
    - PKCE is mandatory. `code_challenge_method` must be `S256`.
    - `nonce` is required when the `openid` scope is requested.
    - All endpoint URLs are absolute and derived from `ISSUER_URL`.
  version: 0.2.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://auth.example.com
    description: Production (replace with your deployment)
tags:
  - name: Health
    description: Service and database health probes
  - name: Discovery
    description: OIDC metadata and signing keys
  - name: OAuth
    description: Authorization code flow with PKCE
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      tags:
        - Health
      summary: Check service and database health
      description: |
        Returns service status. `503` when the database is missing or
        unreachable, `200` otherwise.
      responses:
        '200':
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '503':
          description: Service is up but the database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: unavailable
  /.well-known/openid-configuration:
    get:
      operationId: getDiscoveryDocument
      security: []
      tags:
        - Discovery
      summary: Fetch OIDC discovery metadata
      description: |
        Returns the provider metadata document. `issuer` matches `ISSUER_URL`
        exactly, without a trailing slash.
      responses:
        '200':
          description: Discovery document
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      security: []
      tags:
        - Discovery
      summary: Fetch the public signing keys
      description: |
        Returns the JSON Web Key Set used to verify ID token signatures. The
        response contains public key material only.
      responses:
        '200':
          description: JSON Web Key Set
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
  /authorize:
    get:
      operationId: authorize
      security: []
      tags:
        - OAuth
      summary: Start an authorization code flow
      description: |
        Validates the client and request, then either redirects back to the
        client with an authorization code or shows the flow sign-in prompt.

        `client_id` and `redirect_uri` are validated before any redirect. If
        either is invalid, the provider returns an HTML error page and does
        **not** redirect, because the redirect URI may be attacker-controlled.
        Other request errors redirect to the registered `redirect_uri` with
        `error` and `state` parameters.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: scope
          in: query
          required: false
          schema:
            type: string
            example: openid profile email
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: nonce
          in: query
          required: false
          description: Required when `openid` is requested.
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
      responses:
        '302':
          description: |
            Redirect to the client with `code` and `state`, or with an OAuth
            error (`error`, `error_description`, `state`).
          headers:
            Location:
              schema:
                type: string
        '200':
          description: |
            Flow sign-in prompt (HTML). Shown when no user session exists. Until
            identity providers are configured, the prompt explains that no
            sign-in method is available for the app.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: |
            Invalid or unknown client, or an unregistered redirect URI. The
            response is an HTML error page and never a redirect.
          content:
            text/html:
              schema:
                type: string
  /token:
    post:
      operationId: exchangeToken
      security: []
      tags:
        - OAuth
      summary: Exchange an authorization code for tokens
      description: |
        Verifies the authorization code, PKCE verifier, redirect URI, and
        client authentication, atomically consumes the code, and returns an ID
        token (when `openid` was requested) plus an opaque bearer access token.

        This endpoint is intended for server-to-server calls and is not
        CSRF-protected.

        Phase 1 does not expose a resource endpoint that accepts the bearer
        access token; it is present so standard OAuth2 clients can complete the
        exchange.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request or grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Client authentication failed
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Basic realm="token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    DiscoveryDocument:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
          example: [code]
        grant_types_supported:
          type: array
          items:
            type: string
          example: [authorization_code]
        subject_types_supported:
          type: array
          items:
            type: string
          example: [public]
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          example: [RS256]
        scopes_supported:
          type: array
          items:
            type: string
          example: [openid, profile, email]
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          example: [client_secret_basic, client_secret_post, none]
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          example: [S256]
        claims_supported:
          type: array
          items:
            type: string
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
    JWK:
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          type: string
          example: RSA
        kid:
          type: string
        use:
          type: string
          example: sig
        alg:
          type: string
          example: RS256
        n:
          type: string
          description: Base64url-encoded RSA modulus
        e:
          type: string
          description: Base64url-encoded RSA exponent
          example: AQAB
    TokenRequest:
      type: object
      required: [grant_type, code, redirect_uri, code_verifier]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        client_id:
          type: string
          description: Required for public clients and `client_secret_post`.
        client_secret:
          type: string
          description: Required for confidential clients using `client_secret_post`.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        id_token:
          type: string
          description: Present when the `openid` scope was requested.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 600
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unsupported_grant_type
            - server_error
        error_description:
          type: string
