{{template "base.html" .}}

{{define "content"}}
<div class="entry">
  <main class="authpanel">
    <header class="tblock">
      <div class="tblock-cell"><span class="mark"></span><span class="wordmark">centrauth</span></div>
      <div class="tblock-cell"><span class="tblock-tag">access control</span></div>
      <div class="tblock-cell"><span class="led" aria-hidden="true"></span></div>
    </header>

    <div class="authbody">
      {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}

      <div class="tabs" role="tablist" aria-label="Account access">
        <button type="button" class="tab is-active" id="tab-signin" role="tab" aria-selected="true" aria-controls="signin" data-panel="signin">Sign in</button>
        <button type="button" class="tab" id="tab-signup" role="tab" tabindex="-1" aria-selected="false" aria-controls="signup" data-panel="signup">Create account</button>
      </div>

      <form id="signin" action="/auth/login" method="post" class="auth-form" role="tabpanel" aria-labelledby="tab-signin">
        <div class="field">
          <label for="signin-email">Email</label>
          <input id="signin-email" type="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <input id="signin-password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <form id="signup" action="/auth/register" method="post" class="auth-form" hidden role="tabpanel" aria-labelledby="tab-signup">
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="signup-password-confirm">Confirm password</label>
          <input id="signup-password-confirm" type="password" name="password_confirm" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
    </div>

    <footer class="authfoot">
      <div class="authfoot-cell">self-hosted sso</div>
    </footer>
  </main>
</div>
{{end}}
