root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/centrauth ./cmd/centrauth/main.go"
bin = "./tmp/centrauth"
full_bin = ""
include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]
exclude_dir = ["assets", "tmp", "vendor", "mockups"]
include_dir = []
exclude_file = []
delay = 1000
stop_on_error = true
send_interrupt = false
kill_delay = "0s"

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
