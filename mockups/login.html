<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4F6F4">
  <title>Continue · centrauth</title>
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <!-- Mockup states:
       login.html                  app with providers configured
       login.html?state=empty      app with no sign-in method configured -->
  <div class="entry">
    <main class="authpanel" id="authpanel">
      <header class="tblock">
        <div class="tblock-cell"><span class="mark"></span><span class="wordmark">centrauth</span></div>
        <div class="tblock-cell"><span class="tblock-tag">access control</span></div>
        <div class="tblock-cell"><span class="led" aria-hidden="true"></span></div>
      </header>

      <div class="authbody">
        <div class="appctx">
          <p class="appctx-tag">Sign in to continue to</p>
          <p class="appctx-name">Nightdrive</p>
        </div>

        <div class="providers">
          <button type="button" class="btn btn-provider">
            <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9a8.78 8.78 0 0 0 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7a5.41 5.41 0 0 1 0-3.4V4.96H.96a9 9 0 0 0 0 8.08l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.59C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.96l3 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
            Continue with Google
          </button>
          <button type="button" class="btn btn-provider">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="#24292E" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            Continue with GitHub
          </button>
        </div>

        <div class="alert" role="alert" data-state="empty">
          No sign-in method is configured for this app. Ask its owner to enable an identity provider.
        </div>
      </div>

      <footer class="authfoot">
        <div class="authfoot-cell">self-hosted sso</div>
        <div class="authfoot-cell">auth.homelab.dev</div>
      </footer>
    </main>
  </div>

  <script>
    /* Mockup-only state switch (not part of the design port). */
    (function () {
      if (location.search.indexOf("state=empty") !== -1) {
        document.querySelector(".providers").hidden = true;
        document.querySelector('[data-state="empty"]').hidden = false;
      }
    })();
  </script>
</body>
</html>
